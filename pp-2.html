<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <p><u>ROCK PAPER SCISSOR GAME</u></p>

    <button onclick="playGame('Rock')">ROCK</button>
    <button onclick="playGame('Paper')">PAPER</button>
    <button onclick="playGame('Scissor')">SCISSOR</button>

    <script>
        function playGame(playerMove) {
            const randomNumber = Math.random();
            let computerMove = '';

            if (randomNumber < 1/3) {
                computerMove = 'Rock';
            } else if (randomNumber < 2/3) {
                computerMove = 'Paper';
            } else {
                computerMove = 'Scissor';
            }

            let result = '';

            if (playerMove === 'Rock') {
                if (computerMove === 'Rock') result = 'Tied';
                else if (computerMove === 'Paper') result = 'Lose';
                else result = 'Win';
            }

            else if (playerMove === 'Paper') {
                if (computerMove === 'Rock') result = 'Win';
                else if (computerMove === 'Paper') result = 'Tied';
                else result = 'Lose';
            }

            else if (playerMove === 'Scissor') {
                if (computerMove === 'Rock') result = 'Lose';
                else if (computerMove === 'Paper') result = 'Win';
                else result = 'Tied';
            }

            alert(`You picked ${playerMove}, computer picked ${computerMove}. Result: ${result}`);
        }
    </script>
</body>
</html>
